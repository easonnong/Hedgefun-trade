name: contractV2
on:
  push:
    paths: ['contractV2/**', '.github/workflows/contract-v2.yml']
  pull_request:
    paths: ['contractV2/**', '.github/workflows/contract-v2.yml']
permissions:
  contents: read
env:
  FOUNDRY_VERSION: v1.5.0
defaults:
  run:
    working-directory: contractV2
jobs:
  unit:
    name: V2 build, sizes and offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - run: forge build --sizes
      - run: forge test
      - name: Reject known-bug assertions
        run: |
          if grep -rnE 'function[[:space:]]+test(Fuzz|Fail)?_?BUG_' test/; then
            echo "::error::Known-bug assertions are present"
            exit 1
          fi
  asset-percent-fork:
    name: V2 percentage Engine fork scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: percentage-fork-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - name: Real V3/V4 fork scenarios (50/50 and 70/30 LP)
        env:
          RH_FORK: "1"
          RH_RPC: ${{ secrets.RH_ARCHIVE_RPC_URL || 'blockmachine' }}
        run: |
          set -o pipefail
          python3 -m unittest discover -s tools -p 'test_fork_rpc_proxy.py'
          # Serialize archive reads before they reach the provider; no signing or write methods are permitted.
          archive_rpc="$RH_RPC"
          if [ "$archive_rpc" = blockmachine ]; then archive_rpc=https://rpc-robinhood.blockmachine.io; fi
          FORK_ARCHIVE_RPC="$archive_rpc" python3 tools/fork_rpc_proxy.py --port 18545 --interval-seconds 3 > percent-rpc.log 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          ready=0
          for check in $(seq 1 120); do
            if ! kill -0 "$proxy_pid" 2>/dev/null; then
              echo "::error::the read-only archive proxy failed to start"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:18545/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then echo "::error::archive proxy startup timed out"; exit 1; fi
          export RH_RPC=http://127.0.0.1:18545
          for split in 5000 7000; do
            # Fail on every unsuccessful run, including RPC errors. Manual reruns preserve failed evidence.
            V2_LP_BPS="$split" forge test --fork-url "$RH_RPC" --fork-block-number 70786980 --threads 1 --mc '^V2AssetPercentForkTest$' -vv 2>&1 | tee "percent-fork-$split.log"
            if grep -q '\[SKIP' "percent-fork-$split.log"; then
              echo "::error::percentage fork scenarios were skipped"
              exit 1
            fi
            for scenario in test_forkSellUsesFullNavAndPaysActualOutputReward test_forkBuyBandAndCooldownWaitWithoutConsumingState test_forkOwnLpFeesCollectIntoBuybackWithoutDoubleCounting test_forkChunkAndDynamicDailyBudgetKeepAbsoluteUsed; do
              grep -Fq "[PASS] $scenario()" "percent-fork-$split.log"
            done
          done
          RH_FORK=1 forge test --threads 1 --mc '^V2LaunchNativeRouterMainnetForkTest$' -vv 2>&1 | tee native-mainnet-fork.log
          if grep -q '\[SKIP' native-mainnet-fork.log; then
            echo "::error::native mainnet-state fork was skipped"
            exit 1
          fi
          grep -Fq '[PASS] test_fork_nativeLaunchAndFirstBuy_realWethUsdgGmePools_andAtomicRollback()' native-mainnet-fork.log

  native-launch-testnet-fork:
    name: V2 native launch testnet fork
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: native-launch-testnet-fork-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - name: Fork deployed V2 core and exercise ETH venue, bridge, activation and buy
        env:
          V2_NATIVE_LAUNCH_FORK: "true"
          ETH_MARKET_FORK: "true"
          ETH_BRIDGE_FORK: "true"
          ETH_BASE_BOOK: deploy/testnet-v2-fees.json
        run: |
          set -o pipefail
          cp deploy/testnet-v2-keeper-reward-proof/fee-core-book.json deploy/testnet-v2-fees.json
          native_config=$(python3 tools/native_testnet_config.py)
          native_root=$(dirname "$native_config")
          rpc=https://rpc.testnet.chain.robinhood.com
          passed=0
          for attempt in 1 2 3; do
            block=$(cast block-number --rpc-url "$rpc")
            export V2_NATIVE_LAUNCH_FORK_BLOCK="$block" ETH_MARKET_FORK_BLOCK="$block" ETH_BRIDGE_FORK_BLOCK="$block"
            if forge test --config-path "$native_config" --root "$native_root" --threads 1 --mc 'TestnetV2EthMarketForkTest|V2LaunchNativeRouterForkTest|TestnetV2EthBridgeForkTest' -vv 2>&1 | tee native-launch-fork.log; then
              passed=1
              break
            fi
            if ! grep -Eq 'HTTP error 429|rate limit exceeded|retry_after_ms' native-launch-fork.log; then
              echo "::error::native launch fork failed for a non-rate-limit reason"
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then sleep 65; fi
          done
          if [ "$passed" -ne 1 ]; then exit 1; fi
          if grep -q '\[SKIP' native-launch-fork.log; then
            echo "::error::native launch fork tests were skipped"
            exit 1
          fi
          grep -Fq '[PASS] test_fork_nativeLaunchActivatesAndBuysThroughCanonicalTwoHopV3()' native-launch-fork.log
          grep -Fq '[PASS] test_realWrappedNativeVenueSupportsStockPaymentAndEthUnderlyingGraduationWithoutChangingEightListings()' native-launch-fork.log
          grep -Fq '[PASS] test_nativeOnlyWalletLaunchesAndBuysStockThroughRecoverableBridge()' native-launch-fork.log

  income-kinds-testnet-fork:
    name: V2 income kinds and treasury upgrades on testnet forks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: income-kinds-testnet-fork-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - name: Compile before selecting fresh fork state
        run: forge build --sizes
      - name: Four income kinds, graduation fault cases, staking exits and strategy execution
        env:
          INCOME_KINDS_FORK: "true"
          INCOME_COMPAT_FORK: "true"
          UPGRADEABLE_KINDS_FORK: "true"
          TRADABLE_PERCENT_FORK: "true"
          LAUNCH_FEES_FORK: "true"
          # Pinned state needs archive reads; native-launch jobs keep using the official RPC separately.
          INCOME_KINDS_FORK_RPC: ${{ secrets.RH_INCOME_TESTNET_RPC_URL || 'https://robinhood-testnet.drpc.org' }}
          INCOME_COMPAT_FORK_RPC: ${{ secrets.RH_INCOME_TESTNET_RPC_URL || 'https://robinhood-testnet.drpc.org' }}
          UPGRADEABLE_KINDS_FORK_RPC: ${{ secrets.RH_UPGRADE_TESTNET_RPC_URL || 'https://robinhood-testnet.drpc.org' }}
          TRADABLE_PERCENT_FORK_RPC: ${{ secrets.RH_TRADABLE_TESTNET_RPC_URL || 'https://robinhood-testnet.drpc.org' }}
          LAUNCH_FEES_FORK_RPC: ${{ secrets.RH_TRADABLE_TESTNET_RPC_URL || 'https://robinhood-testnet.drpc.org' }}
          V2_FACTORY: "0xc9610d4A749b2A62a7327a0f40B59013D8fC415a"
          TESTNET_MARKET: "0xc1AF2f52980F8A7AA4E90A8E30D5c3FaF0375f21"
        run: |
          set -euo pipefail
          # Public state is pruned: pin one fresh block for this entire run, after compilation.
          # No keys, script --broadcast, RPC writes or public-chain transactions are used.
          export INCOME_KINDS_FORK_BLOCK=$(cast block-number --rpc-url "$INCOME_KINDS_FORK_RPC")
          export INCOME_COMPAT_FORK_BLOCK="$INCOME_KINDS_FORK_BLOCK"
          export UPGRADEABLE_KINDS_FORK_BLOCK="$INCOME_KINDS_FORK_BLOCK"
          export TRADABLE_PERCENT_FORK_BLOCK="$INCOME_KINDS_FORK_BLOCK"
          export LAUNCH_FEES_FORK_BLOCK="$INCOME_KINDS_FORK_BLOCK"
          [[ "$INCOME_KINDS_FORK_BLOCK" =~ ^[0-9]+$ ]] || { echo "::error::RPC returned no valid block"; exit 1; }
          printf 'chain=46630\nblock=%s\nfactory=%s\nmarket=%s\n' "$INCOME_KINDS_FORK_BLOCK" "$V2_FACTORY" "$TESTNET_MARKET" | tee income-kinds-fork-state.txt
          # RPC failures fail the job. Do not turn an unavailable fork into a green skipped run.
          forge test --threads 1 --mc '^TestnetV2IncomeKindsForkTest$|^TestnetV2IncomeCompatibilityForkTest$|^TestnetV2TreasuryUpgradeForkTest$|^TestnetV2TradablePercentForkTest$|^TestnetV2LaunchFeesForkTest$' -vv 2>&1 | tee income-kinds-fork.log
          if grep -q '\[SKIP' income-kinds-fork.log; then
            echo "::error::income kind fork scenarios were skipped"
            exit 1
          fi
          for scenario in \
            test_dividendKindOnDeployedFactory \
            test_splitKindOnDeployedFactory \
            test_strategy25KindOnDeployedFactory \
            test_strategy50KindOnDeployedFactory \
            test_dividendKindPreclaimedFeesRemainIncome \
            test_splitKindPreclaimedFeesRemainIncome \
            test_strategy25PreclaimedFeesRemainIncome \
            test_strategy50PreclaimedFeesRemainIncome \
            test_dividendKindOptionalBookFailureProtectsPrincipal \
            test_splitKindOptionalBookFailureProtectsPrincipal \
            test_strategy25OptionalBookFailureProtectsPrincipal \
            test_strategy50OptionalBookFailureProtectsPrincipal \
            test_strategy25TakesProfitAndBuysTheDipOnDeployedVenue \
            test_strategy25StopLossOnDeployedVenue \
            test_strategy50TakesProfitAndBuysTheDipOnDeployedVenue \
            test_strategy50StopLossOnDeployedVenue \
            test_fork_legacyFactoryRejectsBeforeRegistrationAndDuringReadback \
            test_fork_reviewedFactoryAcceptsRegistrationAndReadback \
            test_registrationAppendsKindsAndPreservesLegacyManifestsAndChunks \
            test_buybackUpgradePreservesRealBalancesAndLpThenBooksAndBuys \
            test_engineUpgradePreservesRealInventoryAndLpThenExecutesAgain \
            test_registrationAppendsSchemaThreeAndPreservesLegacyManifestsAndChunks \
            test_launchGraduationTradableRebalanceAndUpgradePreserveInventoryAndLpThenExecuteAgain \
            test_forkConfigurePreservesDefaultsAndAcceptsNativeLaunch; do
            grep -Fq "[PASS] $scenario()" income-kinds-fork.log || { echo "::error::missing fork pass: $scenario"; exit 1; }
          done
      - name: Preserve fork block and results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: income-kinds-testnet-fork
          path: |
            contractV2/income-kinds-fork-state.txt
            contractV2/income-kinds-fork.log
          if-no-files-found: warn

  income-fuzz:
    name: V2 income and upgrade fuzz seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: ["0x2026100401", "0x2026100402", "0x2026100403"]
    env:
      FOUNDRY_FUZZ_RUNS: "1024"
      FOUNDRY_INVARIANT_RUNS: "512"
      FOUNDRY_INVARIANT_DEPTH: "128"
      FOUNDRY_INVARIANT_FAIL_ON_REVERT: "true"
      INCOME_TEST_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0
      - name: Graduation bookkeeping, staking conservation and constrained-gas regression
        run: |
          set -euo pipefail
          log="income-fuzz-$INCOME_TEST_SEED.log"
          printf 'seed=%s fuzz_runs=%s invariant_runs=%s invariant_depth=%s fail_on_revert=%s\n' "$INCOME_TEST_SEED" "$FOUNDRY_FUZZ_RUNS" "$FOUNDRY_INVARIANT_RUNS" "$FOUNDRY_INVARIANT_DEPTH" "$FOUNDRY_INVARIANT_FAIL_ON_REVERT" | tee "$log"
          forge test --fuzz-seed "$INCOME_TEST_SEED" --mc '^V2IncomeGraduation.*Test$|^V2StakingIncomeInvariantTest$|^V2StakingAllocationRegressionTest$|^V2StakingRemainderBoundaryTest$|^V2IncomeGasRegressionTest$|^V2BuybackTreasuryUpgradeTest$|^V2EngineTreasuryUpgradeTest$|^V2EngineTreasuryUpgradeInvariantTest$|^V2UpgradeableKindRegistrationTest$|^V2TradablePercent.*Test$' -vv 2>&1 | tee -a "$log"
          if grep -q '\[SKIP' "$log"; then
            echo "::error::income fuzz or invariant scenarios were skipped"
            exit 1
          fi
          grep -q '^\[PASS\]' "$log" || { echo "::error::no income fuzz test passed"; exit 1; }
          # An accidental selector/class rename cannot silently remove an entire regression family.
          for suite in V2IncomeGraduationTest V2IncomeGraduationSixDecimalsTest V2StakingIncomeInvariantTest V2StakingAllocationRegressionTest V2StakingRemainderBoundaryTest V2IncomeGasRegressionTest V2BuybackTreasuryUpgradeTest V2EngineTreasuryUpgradeTest V2EngineTreasuryUpgradeInvariantTest V2UpgradeableKindRegistrationTest V2TradablePercentEngineTest V2TradablePercentAuditTest V2TradablePercentInvariantTest V2TradablePercentRegistrationTest; do
            grep -Fq ":$suite" "$log" || { echo "::error::missing income suite: $suite"; exit 1; }
          done
          grep -Fq '[PASS] invariant_principalAndRewardsAreBackedByIndependentTransfers()' "$log"
          grep -Fq '[PASS] testFuzz_claimTimingCannotRelabelPrincipal(' "$log"
          grep -Fq '[PASS] test_gasLimitedBookPreservesDividendShare()' "$log"
          grep -Fq '[PASS] test_gasLimitedBookPreservesDividendShareWithActiveStaker()' "$log"
          grep -Fq '[PASS] invariant_upgradeNeverResetsTradingStateOrCustody()' "$log"
          grep -Fq '[PASS] invariant_upgradedEngineKeepsTurnoverAndExecutionGuards()' "$log"
          grep -Fq '[PASS] invariant_inventoryAndNonceMatchActualSuccessfulFillsAcrossUpgrades()' "$log"
          grep -Fq '[PASS] invariant_dynamicCapsUseInputAssetsAndNeverRewriteHistoricalSpend()' "$log"
      - name: Preserve seed and results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: income-fuzz-${{ matrix.seed }}
          path: contractV2/income-fuzz-${{ matrix.seed }}.log
          if-no-files-found: warn
