name: PR naming

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  statuses: write

jobs:
  naming:
    name: Validate branch and PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Validate metadata using the base branch's trusted workflow. Never check
      # out or execute PR code with this token, including for fork PRs.
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const types = 'feat|fix|docs|test|refactor|perf|chore|ci|build|style|revert';
            const branchPattern = new RegExp(`^(${types})/[a-z0-9]+(?:-[a-z0-9]+)*$`);
            const titlePattern = new RegExp(`^(${types})(?:\\([a-z0-9]+(?:[-/._][a-z0-9]+)*\\))?!?: \\S(?:[^\\r\\n]*\\S)?$`);
            // Only these existing PRs may keep their original branch names.
            // New PRs reusing the same names must follow the current convention.
            const legacyHeads = new Map([
              [8, 'codex/sync-pr-105'],
              [15, 'codex/sync-pr-119-rhnvda-earn'],
              [21, 'codex/all-strategy-income-tests-20261003'],
              [27, 'codex/audit-operations-migration'],
              [41, 'claude/v2-eth-pairing'],
            ]);
            const sameRepository = pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const legacyBranch = sameRepository && legacyHeads.get(pr.number) === pr.head.ref;
            const errors = [];
            if (!branchPattern.test(pr.head.ref) && !legacyBranch) {
              errors.push('Branch must use type/kebab-case-description; see CONTRIBUTING.md.');
            }
            if (!titlePattern.test(pr.title)) {
              errors.push('PR title must use type(scope): description, with optional scope and !; see CONTRIBUTING.md.');
            }
            // Publish against the PR head SHA: pull_request_target otherwise
            // runs on the base SHA, which is unsuitable for the required status.
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: pr.head.sha,
              state: errors.length ? 'failure' : 'success',
              context: 'PR naming',
              description: errors.length ? 'Invalid branch name or PR title; see workflow log.' : 'Branch name and PR title follow repository conventions.',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (errors.length) core.setFailed(errors.join('\n'));
